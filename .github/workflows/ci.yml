name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate public source
        run: ./scripts/Test-Source.ps1
      - name: Verify Karambit seeker policy
        run: dotnet run --project tests/Karambit/Karambit.Tests.csproj -c Release
      - name: Verify release packaging
        run: ./tests/Release/PrepareRelease.Tests.ps1
